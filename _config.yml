# _config.yml
title: "GraphRAG Lab"
description: "Research, Retrieval-Augmented Generation, and Knowledge Graphs."
url: "https://jwleo.github.io"
baseurl: "/leokongjian.github.io"

# 使用 GitHub Pages 官方支持的主题（方便托管），再通过自定义 CSS 改成 ORNL 风格
theme: minima
# 如果要用远程主题，可以改成：
# remote_theme: pages-themes/cayman@v0.2.0

# 站点作者信息
author:
  name: "GraphRAG Research Group"

# 导航栏配置
header_pages:
  - index.md
  - research.md
  - projects.md
  - publications.md
  - contact.md

# Markdown & 高亮
markdown: kramdown
highlighter: rouge

# 语言与编码
encoding: "utf-8"
timezone: "Asia/Shanghai"

# ✅ 关键：启用 SASS 编译
sass:
  sass_dir: assets/css
  style: compressed

# ORNL 风格配色（供 style.scss 引用）
ornl_theme:
  primary_bg: "#0b1b2b"      # 深蓝黑背景
  primary_fg: "#ffffff"      # 白色文字
  accent_green: "#6bbf59"    # ORNL 绿色点缀
  accent_yellow: "#f4c542"   # 次要强调色
  nav_bg: "#081320"
  nav_fg: "#ffffff"
  footer_bg: "#050b12"
  footer_fg: "#cccccc"

# 社交 / 链接
github_username: "JWleo"

# 构建设置
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# SEO 基本信息
seo:
  type: "website"
  name: "GraphRAG Lab"
  twitter:
    card: "summary_large_image"

# 默认布局
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
